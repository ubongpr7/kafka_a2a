name: interaims-dev-ka2a

x-service: &service
  image: kafka-a2a:dev
  build:
    context: .
    args:
      KA2A_UV_EXTRAS: "server,auth,lang,redis,mcp,voice"
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - platform
  volumes:
    - ./agent_cards:/app/agent_cards:ro
    - ./prompts:/app/prompts:ro
    - ./mcp-tools.dev.json:/app/mcp-tools.dev.json:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  host-agent:
    <<: *service
    container_name: interaims-dev-ka2a-host-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/host_agent.txt
      KA2A_TOOL_EXECUTOR: kafka_a2a.local_tools:build_interaction_tool_executor
      KA2A_ALLOWED_DOWNSTREAM_AGENTS: onboarding,users,product,inventory,pos
    command: ["agent", "--agent-card-path", "/app/agent_cards/host.agent-card.json", "--processor", "langgraph-chat", "--push-notifications"]

  onboarding-agent:
    <<: *service
    container_name: interaims-dev-ka2a-onboarding-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/onboarding_agent.txt
      KA2A_TOOL_EXECUTOR: kafka_a2a.local_tools:build_interaction_tool_executor
      KA2A_ALLOWED_DOWNSTREAM_AGENTS: users,product,inventory
    command: ["agent", "--agent-card-path", "/app/agent_cards/onboarding.agent-card.json", "--processor", "langgraph-chat"]

  users-agent:
    <<: *service
    container_name: interaims-dev-ka2a-users-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/users_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/users.agent-card.json", "--processor", "langgraph-chat"]

  product-agent:
    <<: *service
    container_name: interaims-dev-ka2a-product-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/product_agent.txt
      KA2A_TOOL_EXECUTOR: kafka_a2a.local_tools:build_interaction_tool_executor
      KA2A_ALLOWED_DOWNSTREAM_AGENTS: product_discovery,marketplace_sourcing,product_catalog_admin,product_merchandising,product_pricing
    command: ["agent", "--agent-card-path", "/app/agent_cards/product.agent-card.json", "--processor", "langgraph-chat"]

  product-discovery-agent:
    <<: *service
    container_name: interaims-dev-ka2a-product-discovery-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/product_discovery_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/product_discovery.agent-card.json", "--processor", "langgraph-chat"]

  marketplace-sourcing-agent:
    <<: *service
    container_name: interaims-dev-ka2a-marketplace-sourcing-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/marketplace_sourcing_agent.txt
      KA2A_TOOL_EXECUTOR: kafka_a2a.marketplace_tools:build_marketplace_sourcing_tool_executor
    command: ["agent", "--agent-card-path", "/app/agent_cards/marketplace_sourcing.agent-card.json", "--processor", "langgraph-chat"]

  product-catalog-admin-agent:
    <<: *service
    container_name: interaims-dev-ka2a-product-catalog-admin-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/product_catalog_admin_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/product_catalog_admin.agent-card.json", "--processor", "langgraph-chat"]

  product-merchandising-agent:
    <<: *service
    container_name: interaims-dev-ka2a-product-merchandising-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/product_merchandising_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/product_merchandising.agent-card.json", "--processor", "langgraph-chat"]

  product-pricing-agent:
    <<: *service
    container_name: interaims-dev-ka2a-product-pricing-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/product_pricing_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/product_pricing.agent-card.json", "--processor", "langgraph-chat"]

  inventory-agent:
    <<: *service
    container_name: interaims-dev-ka2a-inventory-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/inventory_agent.txt
      KA2A_TOOL_EXECUTOR: kafka_a2a.local_tools:build_interaction_tool_executor
      KA2A_ALLOWED_DOWNSTREAM_AGENTS: inventory_visibility,inventory_setup,inventory_procurement,inventory_fulfillment
    command: ["agent", "--agent-card-path", "/app/agent_cards/inventory.agent-card.json", "--processor", "langgraph-chat"]

  inventory-visibility-agent:
    <<: *service
    container_name: interaims-dev-ka2a-inventory-visibility-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/inventory_visibility_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/inventory_visibility.agent-card.json", "--processor", "langgraph-chat"]

  inventory-setup-agent:
    <<: *service
    container_name: interaims-dev-ka2a-inventory-setup-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/inventory_setup_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/inventory_setup.agent-card.json", "--processor", "langgraph-chat"]

  inventory-procurement-agent:
    <<: *service
    container_name: interaims-dev-ka2a-inventory-procurement-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/inventory_procurement_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/inventory_procurement.agent-card.json", "--processor", "langgraph-chat"]

  inventory-fulfillment-agent:
    <<: *service
    container_name: interaims-dev-ka2a-inventory-fulfillment-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/inventory_fulfillment_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/inventory_fulfillment.agent-card.json", "--processor", "langgraph-chat"]

  pos-agent:
    <<: *service
    container_name: interaims-dev-ka2a-pos-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/pos_agent.txt
      KA2A_TOOL_EXECUTOR: kafka_a2a.local_tools:build_interaction_tool_executor
      KA2A_ALLOWED_DOWNSTREAM_AGENTS: pos_live,pos_admin
    command: ["agent", "--agent-card-path", "/app/agent_cards/pos.agent-card.json", "--processor", "langgraph-chat"]

  pos-live-agent:
    <<: *service
    container_name: interaims-dev-ka2a-pos-live-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/pos_live_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/pos_live.agent-card.json", "--processor", "langgraph-chat"]

  pos-admin-agent:
    <<: *service
    container_name: interaims-dev-ka2a-pos-admin-agent
    environment:
      KA2A_SYSTEM_PROMPT_PATH: /app/prompts/pos_admin_agent.txt
    command: ["agent", "--agent-card-path", "/app/agent_cards/pos_admin.agent-card.json", "--processor", "langgraph-chat"]

  gateway:
    <<: *service
    container_name: interaims-dev-ka2a-gateway
    depends_on:
      - host-agent
      - onboarding-agent
      - users-agent
      - product-agent
      - product-discovery-agent
      - marketplace-sourcing-agent
      - product-catalog-admin-agent
      - product-merchandising-agent
      - product-pricing-agent
      - inventory-agent
      - inventory-visibility-agent
      - inventory-setup-agent
      - inventory-procurement-agent
      - inventory-fulfillment-agent
      - pos-agent
      - pos-live-agent
      - pos-admin-agent
    command: ["gateway", "--default-agent", "host", "--host", "0.0.0.0", "--port", "7006"]
    expose:
      - "7006"

  a2a-proxy:
    <<: *service
    container_name: interaims-dev-ka2a-proxy
    depends_on:
      - host-agent
      - onboarding-agent
      - users-agent
      - product-agent
      - product-discovery-agent
      - marketplace-sourcing-agent
      - product-catalog-admin-agent
      - product-merchandising-agent
      - product-pricing-agent
      - inventory-agent
      - inventory-visibility-agent
      - inventory-setup-agent
      - inventory-procurement-agent
      - inventory-fulfillment-agent
      - pos-agent
      - pos-live-agent
      - pos-admin-agent
    command: ["proxy", "--agent-name", "host", "--host", "0.0.0.0", "--port", "7007"]
    expose:
      - "7007"

  runtime:
    <<: *service
    container_name: interaims-dev-ka2a-runtime
    depends_on:
      - gateway
    command: ["runtime"]

  voice-agent:
    <<: *service
    container_name: interaims-dev-ka2a-voice-agent
    depends_on:
      - gateway
      - host-agent
    environment:
      KA2A_CONTROL_PLANE_BASE_URL: http://interaims-dev-ka2a-gateway:7006
      KA2A_LIVEKIT_AGENT_NAME: ka2a-voice
      KA2A_VOICE_HOST_AGENT_NAME: host
      KA2A_VOICE_TTS_VOICE: marin
      KA2A_VOICE_STT_MODEL: whisper-1
      KA2A_VOICE_TTS_MODEL: gpt-4o-mini-tts
      KA2A_VOICE_LLM_MODEL: gpt-4.1-mini
      KA2A_VOICE_HOST_TIMEOUT_S: "240"
      KA2A_VOICE_BACKEND_DELEGATION_ENABLED: "true"
    command: ["voice"]

networks:
  platform:
    external: true
    name: interaims-platform
